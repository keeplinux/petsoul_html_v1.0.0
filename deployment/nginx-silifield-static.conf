# ============================================================
# 方案 B（回退预案）：纯 Nginx 直接服务 static/，不跑 Rust
# 放置路径：/etc/nginx/conf.d/silifield.com-static.conf
# 前置：
#   1) 静态文件在 /opt/petsoul/static/（含 index.html）
#   2) 停用方案 A 进程：sudo systemctl disable --now petsoul
#   3) SSL 证书位于 /etc/nginx/ssl/silifield.com.{pem,key}
# 校验：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# —— HTTP 全量 301 到 HTTPS ——
server {
    listen 80;
    listen [::]:80;
    server_name silifield.com www.silifield.com;
    return 301 https://$host$request_uri;
}

# —— HTTPS ——
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name silifield.com www.silifield.com;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/ssl/silifield.com.pem;
    ssl_certificate_key /etc/nginx/ssl/silifield.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- 静态站点根目录 ----
    root /opt/petsoul/static;
    index index.html;

    # ---- gzip 压缩（替代方案 A 中 axum 的压缩）----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- 安全头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/silifield.com.access.log;
    error_log  /var/log/nginx/silifield.com.error.log;

    # 前端路由为锚点单页，直接按静态文件找，找不到给 404
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
