# ============================================================
# 方案 A：Nginx 终止 TLS -> 反向代理 -> Rust axum(127.0.0.1:3000)
# 放置路径：/etc/nginx/conf.d/silifield.com.conf
# 前置：SSL 证书位于 /etc/nginx/ssl/silifield.com.{pem,key}
# 校验：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# —— HTTP 全量 301 到 HTTPS ——
server {
    listen 80;
    listen [::]:80;
    server_name silifield.com www.silifield.com;

    # 仅保留跳转，避免 80 提供明文内容
    return 301 https://$host$request_uri;
}

# —— HTTPS ——
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name silifield.com www.silifield.com;

    # ---- TLS 证书（阿里云免费证书）----
    ssl_certificate     /etc/nginx/ssl/silifield.com.pem;
    ssl_certificate_key /etc/nginx/ssl/silifield.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全响应头（增强信任）----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 日志 ----
    access_log /var/log/nginx/silifield.com.access.log;
    error_log  /var/log/nginx/silifield.com.error.log;

    # ---- 反向代理到 Rust axum ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;

        # 静态资源长缓存（版本号? v= 变化时自动失效）
        location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
            proxy_pass http://127.0.0.1:3000;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }

    # 健康检查不与外部共享（如需外部监控可去掉注释并限定来源 IP）
    # location = /health {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000/health;
    # }
}
