<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="SiliField 温暖恒星小猫">
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#f6c39b"/>
      <stop offset="1" stop-color="#e0894f"/>
    </radialGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b3"/>
      <stop offset="1" stop-color="#f2a25c"/>
    </linearGradient>
  </defs>

  <!-- 暖金徽章底 -->
  <circle cx="48" cy="48" r="44" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="rgba(255,244,232,0.55)" stroke-width="1.6"/>

  <!-- 耳朵（外层奶白，内层苔青） -->
  <path d="M26 41 L29 14 L44 29 Z" fill="#f7ede3"/>
  <path d="M70 41 L67 14 L52 29 Z" fill="#f7ede3"/>
  <path d="M30.5 35 L32 20 L40 28 Z" fill="#7fb5a0"/>
  <path d="M65.5 35 L64 20 L56 28 Z" fill="#7fb5a0"/>

  <!-- 猫脸 -->
  <circle cx="48" cy="54" r="26" fill="#f7ede3"/>
  <circle cx="48" cy="54" r="26" fill="none" stroke="rgba(58,46,39,0.10)" stroke-width="1"/>

  <!-- 额头小恒星 -->
  <circle cx="48" cy="33" r="10" fill="rgba(255,227,179,0.45)"/>
  <path d="M48 25.8 L50.1 30.4 L55 30.9 L51.4 34.2 L52.4 39.1 L48 36.7 L43.6 39.1 L44.6 34.2 L41 30.9 L45.9 30.4 Z" fill="url(#starG)" stroke="#e0894f" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- 眯眯笑眼 -->
  <path d="M36 53 Q39 57.2 42 53" fill="none" stroke="#3a2e27" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M54 53 Q57 57.2 60 53" fill="none" stroke="#3a2e27" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 腮红 -->
  <circle cx="33.5" cy="61" r="3.4" fill="#f0a06c" opacity="0.5"/>
  <circle cx="62.5" cy="61" r="3.4" fill="#f0a06c" opacity="0.5"/>

  <!-- 鼻子 + 微笑 -->
  <path d="M45 59.5 L51 59.5 L48 63 Z" fill="#e0894f"/>
  <path d="M44 65.5 Q46 68.2 48 65.5 Q50 68.2 52 65.5" fill="none" stroke="#3a2e27" stroke-width="2" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="rgba(58,46,39,0.55)" stroke-width="1.8" stroke-linecap="round">
    <path d="M23 58 L14 55"/>
    <path d="M23 63 L14 63"/>
    <path d="M23 68 L15 70"/>
    <path d="M73 58 L82 55"/>
    <path d="M73 63 L82 63"/>
    <path d="M73 68 L81 70"/>
  </g>

  <!-- 胸前小水珠吊坠 -->
  <path d="M48 68.8 C50.8 72 50.8 75 48 76.6 C45.2 75 45.2 72 48 68.8 Z" fill="#7fb5a0"/>
  <path d="M46.8 74.2 C46.1 73.3 46.1 72.2 47 71.3" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.1" stroke-linecap="round"/>
</svg>
